[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ragfoundry"
version = "0.2.0"
description = "Configurable production RAG on LangChain and LangGraph: loaders, chunking, embeddings, vector stores, LLMs, evaluation and observability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rithvik Katpelly" }]
keywords = ["rag", "retrieval-augmented-generation", "langchain", "langgraph", "llm", "vector-database", "evaluation", "chatbot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain-core>=1.0",
  "langchain-community>=0.4",
  "langchain-text-splitters>=1.0",
  "langgraph>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Document sources (.txt, .md and .csv need no extra).
pdf = ["pypdf>=4.0"]
docx = ["docx2txt>=0.8"]
excel = ["openpyxl>=3.1", "xlrd>=2.0"]
web = ["httpx>=0.27", "beautifulsoup4>=4.12"]
tokens = ["tiktoken>=0.7"]
loaders = ["ragfoundry[pdf,docx,excel,web,tokens]"]
# Embeddings and LLMs.
huggingface = ["langchain-huggingface>=1.0", "sentence-transformers>=3.0"]
openai = ["langchain-openai>=1.0"]
gemini = ["langchain-google-genai>=4.0"]
groq = ["langchain-groq>=1.0"]
claude = ["langchain-anthropic>=1.0"]
ollama = ["langchain-ollama>=1.0"]
# Vector stores.
chroma = ["langchain-chroma>=1.0"]
faiss = ["faiss-cpu>=1.8"]
pinecone = ["langchain-pinecone>=0.2"]
qdrant = ["langchain-qdrant>=1.0"]
weaviate = ["langchain-weaviate>=0.0.5"]
milvus = ["langchain-milvus>=0.3", "pymilvus[milvus_lite]>=2.5"]
pgvector = ["langchain-postgres>=0.0.15", "psycopg[binary]>=3.1"]
# Reranking.
cohere = ["langchain-cohere>=0.4"]
# Evaluation and observability.
ragas = ["ragas>=0.4"]
langsmith = ["langsmith>=0.3"]
langfuse = ["langfuse>=3.0"]
all = [
  "ragfoundry[loaders,huggingface,openai,gemini,groq,claude,ollama]",
  "ragfoundry[chroma,faiss,pinecone,qdrant,weaviate,milvus,pgvector]",
  "ragfoundry[cohere,ragas,langsmith,langfuse]",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "reportlab>=4", "python-docx>=1.1"]

[project.urls]
Homepage = "https://github.com/rithvikkatpelly/ragfoundry"
Documentation = "https://rithvikkatpelly.github.io/ragfoundry/"
Repository = "https://github.com/rithvikkatpelly/ragfoundry"
Issues = "https://github.com/rithvikkatpelly/ragfoundry/issues"
Changelog = "https://github.com/rithvikkatpelly/ragfoundry/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ragfoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]
markers = ["integration: needs a running service or real model"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
